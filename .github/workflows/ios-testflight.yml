name: iOS TestFlight (manual)
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to existing internal TestFlight audience (never App Store release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pibo-ios-testflight
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'openma-ai/pi-bot' && github.ref_name == github.event.repository.default_branch && github.run_attempt == 1
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - run: npm run check && npm test && npm run gui:check
  package:
    needs: verify
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - name: Toolchain and unique build
        run: |
          set -eu
          xcodebuild -version
          test "$(xcodebuild -version | head -1 | awk '{print int($2)}')" -ge 26
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-apple-ios
          python3 - <<'PY'
          import os
          run=int(os.environ['GITHUB_RUN_NUMBER'])
          major=2000+run//10000
          if major>9999: raise SystemExit('Allocate a new marketing version before counter rollover')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'PIBO_IOS_BUILD={major}.{run//100%100}.{run%100}\n')
          PY
      - run: npm ci && npm --prefix clients/tauri ci
      - run: sh clients/tauri/scripts/build-embedded-tailscale.sh ios
      - run: bash clients/tauri/scripts/ios-testflight.sh build
      # These credentials are NOT configured by this commit. Environment approval
      # is required before anyone provisions them or enables remote execution.
      - name: Install approved signing material on disposable runner only
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -eu
          umask 077
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD" && test -n "$PROFILE_BASE64"
          signing="$RUNNER_TEMP/pibo-signing"
          mkdir -m 700 "$signing"
          printf '%s' "$P12_BASE64" | base64 --decode > "$signing/identity.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$signing/profile.mobileprovision"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          keychain="$signing/signing.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing/identity.p12" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          # Only the new disposable runner keychain, never the user's Mac keychain.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$signing/profile.mobileprovision" > "$signing/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing/profile.plist")
          test "$uuid" != ''
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PIBO_CI_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - run: bash clients/tauri/scripts/ios-testflight.sh archive
      - run: python3 clients/tauri/scripts/verify-ios-archive.py "artifacts/ios-$PIBO_IOS_BUILD/Pibo.xcarchive" --build "$PIBO_IOS_BUILD"
      - run: bash clients/tauri/scripts/ios-testflight.sh export
      - name: Prepare approved upload API credential
        if: inputs.upload
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          umask 077
          test -n "$ASC_PRIVATE_KEY" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/pibo-signing/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/pibo-signing/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Upload once to TestFlight
        if: inputs.upload
        env: {PIBO_CONFIRM_TESTFLIGHT_UPLOAD: "YES"}
        run: bash clients/tauri/scripts/ios-testflight.sh upload
      - uses: actions/upload-artifact@v4
        with:
          name: Pibo-${{ env.PIBO_IOS_BUILD }}
          retention-days: 7
          path: |
            artifacts/ios-${{ env.PIBO_IOS_BUILD }}/export/*.ipa
            artifacts/ios-${{ env.PIBO_IOS_BUILD }}/release.json
      - name: Remove only disposable CI signing material
        if: always()
        run: |
          signing="$RUNNER_TEMP/pibo-signing"
          if [ -f "$signing/signing.keychain-db" ]; then security delete-keychain "$signing/signing.keychain-db"; fi
          if [ -n "${PIBO_CI_PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PIBO_CI_PROFILE_UUID.mobileprovision"; fi
          rm -rf "$signing"

[package]
name = "pi-bot-desktop"
version = "0.1.0"
edition = "2021"
default-run = "pi-bot-desktop"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "io-util"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
semver = "1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
zeroize = "1"
rand = { version = "0.10", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tokio = { version = "1", features = ["process"] }

[features]
embedded-tailscale = []
client-fixtures = ["dep:rand"]

custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "ios-ssh-fixture"
path = "src/bin/ios-ssh-fixture.rs"
required-features = ["client-fixtures"]
